    - "c'est un salon lumineux"
    - "il a dit d'allumer les lumières"
    - "n'allume pas les leds"
    - "peut-être éteindre la clim demain"
    - "le luminaire du salon est joli"
  éteins les lumières:
    - "éteins toutes les lumières"
    - "Alfred coupe toutes les lumières"
    - "peux-tu éteindre les lumières"
    - "eteint les lumières"
    - "est un les lumières"
  allume les lumières:
    - "allume toutes les lumières"
    - "Alfred éclaire tout"
    - "peux-tu allumer les lumières"
    - "active les lumières"
    - "à l'homme les lumières"
