# Exemples courts ajoutés aux données générées par Laya Studio.
# Ils couvrent les commandes canoniques, les formulations polies et les confusions ASR fréquentes.
# Le pipeline d'ajustement ignore les doublons déjà présents dans le jeu généré.
examples:
