    - "Alfred allume le luminaire du salon"
    - "peux-tu allumer le luminaire du salon"
    - "active le luminaire du salon"
    - "à l'homme le luminaire du salon"
  éteins l'halogène:
    - "éteins l'halogène"
    - "Alfred éteins l'halogène"
    - "peux-tu éteindre l'halogène"
    - "est un eugène"
    - "eteint la le jeune"
  éteins le luminaire du salon:
