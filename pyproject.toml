[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "alfred-voice-assistant"
version = "0.1.0"
description = "Assistant vocal français local avec Vosk, Laya et Home Assistant"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "huggingface-hub>=0.34,<2",
  "laya==0.4.14; sys_platform == 'linux'",
  "laya-mlx>=0.5,<0.6; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "numpy>=1.26,<3",
  "safetensors>=0.4,<1",
  "sounddevice>=0.5,<0.6",
  "torch==2.6.0; sys_platform == 'linux'",
  # 0.3.42 est la dernière version fournissant une wheel macOS Universal2.
  "vosk==0.3.42",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
alfred-local = "alfred_voice_assistant.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/alfred_voice_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }
